<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste Bridge — Central de Certificados</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; }
    button, a.button { padding: 12px 16px; margin: 0 8px 8px 0; cursor: pointer; display: inline-block; }
    a.button { border: 1px solid #aaa; color: #111; text-decoration: none; background: #fff; }
    pre { background: #f5f7fa; padding: 16px; border-radius: 8px; white-space: pre-wrap; }
    iframe { width: 1px; height: 1px; border: 0; position: absolute; left: -9999px; }
  </style>
  <link rel="icon" type="image/png" href="assents/sem_fundo/brasao_portal_semec.png?v=20261003">
</head>
<body>
  <h1>Teste de comunicação GitHub → Apps Script</h1>
  <p>Esta página valida a ponte técnica antes de ligarmos a interface oficial.</p>

  <button type="button" id="ping" disabled>Testar conexão</button>
  <button type="button" id="unidade" disabled>Identificar unidade</button>
  <button type="button" id="listar" disabled>Listar certificados</button>
  <button type="button" id="historico" disabled>Listar histórico de envios</button>
  <button type="button" id="reparos" disabled>Listar solicitações de reparo</button>
  <input id="buscaNome" type="search" placeholder="Nome do servidor" style="padding:12px 10px;min-width:220px;margin-right:8px">
  <button type="button" id="buscar" disabled>Buscar certificados</button>
  <a class="button" id="abrirBackend" target="_blank" rel="noopener"
     href="https://script.google.com/a/macros/edu.tangaradaserra.mt.gov.br/s/AKfycbwBzokI4suZwZmEOJilCJ2N6y7PfWEH26hlJaYdfqCYb6m6VO7JK_-ktGwMlO2MYus/exec?modo=diagnostico">
    Abrir diagnóstico do backend
  </a>

  <pre id="saida">Aguardando o backend...</pre>

  <iframe
    id="bridge"
    src="https://script.google.com/a/macros/edu.tangaradaserra.mt.gov.br/s/AKfycbwBzokI4suZwZmEOJilCJ2N6y7PfWEH26hlJaYdfqCYb6m6VO7JK_-ktGwMlO2MYus/exec"
    title="Ponte técnica da Central de Certificados">
  </iframe>

  <script>
    (() => {
      'use strict';

      const saida = document.getElementById('saida');
      const ping = document.getElementById('ping');
      const unidade = document.getElementById('unidade');
      const listar = document.getElementById('listar');
      const historico = document.getElementById('historico');
      const reparos = document.getElementById('reparos');
      const buscar = document.getElementById('buscar');
      const buscaNome = document.getElementById('buscaNome');

      let bridgePort = null;
      const pendentes = new Set();

      function id() {
        return 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      }

      function habilitar(port, versao) {
        bridgePort = port;
        bridgePort.start?.();

        bridgePort.onmessage = (event) => {
          const msg = event.data || {};
          if (!msg.requestId || !pendentes.has(msg.requestId)) return;
          pendentes.delete(msg.requestId);
          saida.textContent = JSON.stringify(msg, null, 2);
        };

        saida.textContent = 'Bridge pronto. Pode testar.' + (versao ? '\nVersão: ' + versao : '');
        ping.disabled = false;
        unidade.disabled = false;
        listar.disabled = false;
        historico.disabled = false;
        reparos.disabled = false;
        buscar.disabled = false;
      }

      function enviar(acao, dados = {}) {
        if (!bridgePort) {
          saida.textContent = 'A ponte ainda não está pronta.';
          return;
        }

        const requestId = id();
        pendentes.add(requestId);
        saida.textContent = 'Consultando ' + acao + '...';

        bridgePort.postMessage({
          canal: 'CENTRAL_CERTIFICADOS_SEMEC',
          requestId,
          acao,
          dados
        });
      }

      window.addEventListener('message', (event) => {
        const msg = event.data || {};
        if (msg.canal !== 'CENTRAL_CERTIFICADOS_SEMEC' || msg.tipo !== 'BRIDGE_READY') return;

        const port = event.ports && event.ports[0];
        if (!port) {
          saida.textContent = 'O backend respondeu, mas não entregou o canal de comunicação.';
          return;
        }

        habilitar(port, msg.versaoBridge || '');
      });

      window.setTimeout(() => {
        if (!bridgePort) {
          saida.textContent =
            'O backend não concluiu a ponte.\n' +
            'Clique em “Abrir diagnóstico do backend”. Se o diagnóstico abrir normalmente, ' +
            'o problema está na ponte incorporada e não na implantação.';
        }
      }, 7000);

      ping.addEventListener('click', () => enviar('PING'));
      unidade.addEventListener('click', () => enviar('IDENTIFICAR_UNIDADE'));
      listar.addEventListener('click', () => enviar('LISTAR_CERTIFICADOS', { ano: '2026' }));
      historico.addEventListener('click', () => enviar('LISTAR_HISTORICO_ENVIOS', { limite: 20 }));
      reparos.addEventListener('click', () => enviar('LISTAR_SOLICITACOES_REPARO', { limite: 20 }));
      buscar.addEventListener('click', () => enviar('BUSCAR_CERTIFICADOS', { busca: buscaNome.value, ano: '2026' }));
    })();
  </script>
</body>
</html>
